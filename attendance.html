<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SchoolFlow · Teacher Attendance</title><style>body{font:16px system-ui;margin:0;background:#f3f7fa;color:#173947}header{background:#075363;color:white;padding:18px}main{max-width:850px;margin:24px auto;padding:0 14px}.card{background:white;padding:20px;border-radius:12px;margin-bottom:14px}input,select,button{font:inherit;padding:11px;border-radius:8px;border:1px solid #b8cdd2}input,select{max-width:100%;box-sizing:border-box}button{background:#087486;color:white;border:0;cursor:pointer}button:disabled{opacity:.5}.line{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 0;border-bottom:1px solid #e2ebed;flex-wrap:wrap}.status-tabs{display:flex;gap:5px;flex-wrap:wrap}.status-tabs button{background:#e8f0f2;color:#234754;border:2px solid transparent;padding:9px 11px;font-size:13px;min-width:72px}.status-tabs button[aria-pressed="true"]{background:#087486;color:#fff;border-color:#075363;font-weight:700}.student-name{font-weight:650}.success{background:#dff5e8;color:#17633a;padding:12px;border-radius:8px}.error{color:#a12232}.muted{color:#627c87}.hidden{display:none}label{display:block;margin:10px 0 5px}a{color:inherit}</style></head><body><header><strong>SchoolFlow · Attendance Register</strong> · <a href="admin.html">Admin</a></header><main><p id="message" role="status"></p><section class="card" id="login"><h2>Staff sign in</h2><form id="loginForm"><label>Email<input type="email" id="email" required autocomplete="username"></label><label>Password<input type="password" id="password" required autocomplete="current-password"></label><p><button>Sign in</button></p></form></section><section id="app" class="hidden"><div class="card"><button id="logout">Sign out</button><h2>Daily attendance</h2><label>Class<select id="classSelect"></select></label><label>Attendance date<input id="date" type="date"></label><p><button id="load">Load register</button></p></div><div class="card"><div id="students"></div><p><button id="save" class="hidden">Save attendance</button></p></div></section></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script><script>
const client=window.supabase.createClient('https://ufddjrebwqfqaqppdgxj.supabase.co','sb_publishable_T5jKK_iqiCVr0lXBmciGQA_L83zO1ZG');
const el=id=>document.getElementById(id), msg=(t,err=false)=>{el('message').textContent=t;el('message').className=err?'error':''};
let schoolId=null,rows=[],userId=null;
const today=()=>{const d=new Date();return [d.getFullYear(),String(d.getMonth()+1).padStart(2,'0'),String(d.getDate()).padStart(2,'0')].join('-')};
el('date').value=today();
async function init(){const {data:{user}}=await client.auth.getUser();if(!user){el('login').classList.remove('hidden');el('app').classList.add('hidden');return}userId=user.id;const {data:members,error}=await client.from('school_members').select('school_id,role').eq('user_id',user.id);if(error||!members?.length){msg('This account has no school membership.',true);return}schoolId=members[0].school_id;const admin=members[0].role==='admin';let classes,err;if(admin){({data:classes,error:err}=await client.from('classes').select('id,name').eq('school_id',schoolId).order('name'));}else{const {data:profiles,error:pe}=await client.from('teacher_profiles').select('id').eq('school_id',schoolId).eq('user_id',user.id).eq('active',true);if(pe){msg(pe.message,true);return}const ids=(profiles||[]).map(p=>p.id);if(!ids.length){msg('Teacher login has not been linked to a profile.',true);return}const {data:assign,error:ae}=await client.from('class_teachers').select('class_id').eq('school_id',schoolId).in('teacher_id',ids);if(ae){msg(ae.message,true);return}const classIds=[...new Set((assign||[]).map(a=>a.class_id))];if(classIds.length){const result=await client.from('classes').select('id,name').eq('school_id',schoolId).in('id',classIds).order('name');classes=result.data;if(result.error){msg(result.error.message,true);return}}else classes=[]}
el('classSelect').replaceChildren(...(classes||[]).map(c=>{const o=document.createElement('option');o.value=c.id;o.textContent=c.name;return o}));el('login').classList.add('hidden');el('app').classList.remove('hidden');if(classes?.length)await load();else msg('No classes assigned to this account.')}
async function load(){const classId=el('classSelect').value,date=el('date').value;if(!classId||!date){msg('Choose a class and date.',true);return}const a=await client.from('students').select('id,full_name,student_code').eq('school_id',schoolId).eq('class_id',classId).eq('active',true).order('full_name');if(a.error){msg(a.error.message,true);return}const b=await client.from('attendance_records').select('student_id,status').eq('school_id',schoolId).eq('attendance_date',date).in('student_id',(a.data||[]).map(s=>s.id));if(b.error){msg(b.error.message,true);return}const existing=new Map((b.data||[]).map(x=>[x.student_id,x.status]));rows=(a.data||[]).map(s=>({...s,status:existing.get(s.id)||'present'}));const root=el('students');root.replaceChildren();const h=document.createElement('h3');h.textContent='Students ('+rows.length+')';root.append(h);for(const s of rows){const div=document.createElement('div');div.className='line';const label=document.createElement('span');label.textContent=s.full_name+' · '+s.student_code;label.className='student-name';const tabs=document.createElement('div');tabs.className='status-tabs';tabs.setAttribute('role','group');tabs.setAttribute('aria-label','Attendance for '+s.full_name);const buttons=[];for(const status of ['present','absent','late','excused']){const button=document.createElement('button');button.type='button';button.textContent=status[0].toUpperCase()+status.slice(1);button.setAttribute('aria-pressed',String(s.status===status));button.addEventListener('click',()=>{s.status=status;buttons.forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.status===status)));msg('Unsaved changes — click Save attendance.');});button.dataset.status=status;buttons.push(button);tabs.append(button)}div.append(label,tabs);root.append(div)}el('save').classList.toggle('hidden',!rows.length);msg(rows.length?'Register loaded. Review each student before saving.':'No active students in this class.')}
async function save(){const btn=el('save');btn.disabled=true;try{const payload=rows.map(s=>({school_id:schoolId,student_id:s.id,attendance_date:el('date').value,status:s.status,recorded_by:userId,method:'manual',check_in_at:s.status==='present'||s.status==='late'?new Date().toISOString():null}));const {error}=await client.from('attendance_records').upsert(payload,{onConflict:'school_id,student_id,attendance_date'});if(error)throw error;msg('Attendance saved successfully.')}catch(e){msg(e.message,true)}finally{btn.disabled=false}}
el('loginForm').onsubmit=async e=>{e.preventDefault();const {error}=await client.auth.signInWithPassword({email:el('email').value.trim(),password:el('password').value});if(error)msg(error.message,true);else await init()};el('logout').onclick=async()=>{await client.auth.signOut();location.reload()};el('load').onclick=load;el('save').onclick=save;init();
</script></body></html>
