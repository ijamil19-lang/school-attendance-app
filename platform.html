<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SchoolFlow · Platform</title><style>:root{font-family:system-ui,Arial;background:#f2f7fa;color:#173743}*{box-sizing:border-box}body{margin:0}header{background:#075363;color:white;padding:20px 5%;display:flex;justify-content:space-between;align-items:center}main{max-width:1050px;margin:30px auto;padding:0 16px}.card{background:white;padding:22px;border-radius:14px;box-shadow:0 2px 12px #1233;margin-bottom:20px}button{background:#087486;color:white;border:0;border-radius:8px;padding:11px 16px;cursor:pointer}input{width:100%;padding:11px;border:1px solid #abc;border-radius:7px;margin:5px 0 12px}label{font-weight:600;font-size:14px}.hidden{display:none}.muted{color:#617986}.row{padding:13px 0;border-bottom:1px solid #e5eef1;display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.stats div{background:#eaf3f5;padding:16px;border-radius:10px}.error{color:#a32132}a{color:inherit}@media(max-width:600px){.stats{grid-template-columns:1fr}}</style></head><body><header><strong>SchoolFlow · Platform</strong><a href="admin.html">School dashboard</a></header><main><p id="notice" role="status"></p><section id="login" class="card"><h2>Platform owner sign in</h2><form id="form"><label>Email<input id="email" type="email" required></label><label>Password<input id="password" type="password" required></label><button>Sign in</button></form></section><section id="app" class="hidden"><div class="card"><div class="row"><h2>Platform overview</h2><button id="signout">Sign out</button></div><div class="stats"><div><strong id="schools">0</strong><p>Schools</p></div><div><strong id="students">0</strong><p>Students</p></div><div><strong id="teachers">0</strong><p>Teachers</p></div></div></div><div class="card"><h2>Registered schools</h2><div id="list"></div></div><div class="card"><h2>Add a school</h2><p class="muted">Provision a school and send its administrator an invitation to set a password.</p><form id="create"><label>School name<input id="name" required maxlength="150"></label><label>Country<input id="country" required maxlength="100"></label><label>Administrator email<input id="adminEmail" type="email" required></label><button id="createBtn">Create school and invite admin</button></form></div></section></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>const client=supabase.createClient('https://ufddjrebwqfqaqppdgxj.supabase.co','sb_publishable_T5jKK_iqiCVr0lXBmciGQA_L83zO1ZG');const el=id=>document.getElementById(id);function notice(t,error=false){el('notice').textContent=t;el('notice').className=error?'error':''}async function init(){const {data:{user}}=await client.auth.getUser();if(!user){notice('');el('app').classList.add('hidden');el('login').classList.remove('hidden');return}const {data:owner,error}=await client.rpc('is_platform_owner');if(error||owner!==true){el('app').classList.add('hidden');el('login').classList.remove('hidden');notice('This account does not have platform-owner access.',true);return}notice('');el('login').classList.add('hidden');el('app').classList.remove('hidden');await refresh()}async function refresh(){const {data,error}=await client.rpc('platform_list_schools');if(error){notice(error.message,true);return}el('schools').textContent=data.length;el('students').textContent=data.reduce((n,s)=>n+Number(s.student_count),0);el('teachers').textContent=data.reduce((n,s)=>n+Number(s.teacher_count),0);el('list').replaceChildren();for(const s of data){const row=document.createElement('div');row.className='row';const name=document.createElement('strong');name.textContent=s.name;const detail=document.createElement('span');detail.className='muted';detail.textContent=(s.country||'Country not set')+' · '+s.admin_count+' admins · '+s.student_count+' students';const controls=document.createElement('span');const state=document.createElement('strong');state.textContent=s.is_active?'Active':'Suspended';state.style.color=s.is_active?'#137349':'#a32132';state.style.marginRight='12px';const btn=document.createElement('button');btn.textContent=s.is_active?'Suspend':'Reactivate';btn.style.background=s.is_active?'#a05a18':'#137349';btn.onclick=async()=>{const action=s.is_active?'suspend':'reactivate';if(!confirm('Are you sure you want to '+action+' '+s.name+'? '+(s.is_active?'School staff will lose access. All records will be preserved.':'School staff will regain access.')))return;btn.disabled=true;const {error}=await client.rpc('platform_set_school_active',{p_school:s.id,p_active:!s.is_active});if(error){notice(error.message,true);btn.disabled=false;return}notice(s.name+' '+(s.is_active?'suspended':'reactivated')+'.');await refresh()};controls.append(state,btn);row.append(name,detail,controls);el('list').append(row)}if(!data.length)el('list').textContent='No schools yet.'}el('form').onsubmit=async e=>{e.preventDefault();const {error}=await client.auth.signInWithPassword({email:el('email').value.trim(),password:el('password').value});if(error)notice(error.message,true);else await init()};el('signout').onclick=async()=>{await client.auth.signOut();location.reload()};el('create').onsubmit=async e=>{e.preventDefault();el('createBtn').disabled=true;const {data,error}=await client.functions.invoke('schoolflow-provision-school',{body:{name:el('name').value.trim(),country:el('country').value.trim(),adminEmail:el('adminEmail').value.trim()}});el('createBtn').disabled=false;if(error){let detail=error.message;try{const j=await error.context.json();detail=j.error||detail}catch{}notice(detail,true);return}notice(data?.message||'School created.');el('create').reset();await refresh()};init();</script></body></html>
